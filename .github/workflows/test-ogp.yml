# ogp/ の変更に対して型チェック・Lint・テスト・ビルドを実行する。
name: Test ogp

on:
  pull_request:
    paths:
      - 'ogp/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-ogp.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ./ogp exec tsc --noEmit

      - run: pnpm --filter ./ogp exec biome check src/og scripts

      - run: pnpm --filter ./ogp test

      - run: pnpm --filter ./ogp build

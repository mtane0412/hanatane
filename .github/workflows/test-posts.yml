# posts/ の変更に対して型チェック・Lint・テストを実行する。
name: Test posts

on:
  pull_request:
    paths:
      - 'posts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-posts.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ./posts type-check

      - run: pnpm --filter ./posts lint

      - run: pnpm --filter ./posts test

      # メンバー限定記事が平文でコミットされていないか（復号しないため age 鍵は不要）
      - run: pnpm --filter ./posts check-private

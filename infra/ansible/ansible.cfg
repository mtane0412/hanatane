[defaults]
inventory           = inventory.ini
# リモートユーザーはインベントリで定義
# SSH 設定は ~/.ssh/config の Host sakura を参照する
private_key_file    = ~/.ssh/id_ed25519
host_key_checking   = True

# community.sops lookup が ~/.config/sops/age/keys.txt を自動参照する
# SOPS_AGE_KEY_FILE 環境変数が未設定の場合はこのデフォルトパスを使用

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True

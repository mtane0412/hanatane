---
# Ghost VPS 共通変数
#
# ghost_image_tag: デプロイするGhostのDockerイメージタグ
# Renovate が新バージョン検知時に PR を作成して自動更新する。

ghost_image_tag: "6.63.0"

# ---- ドメイン ----

# Ghost のサービスドメイン（Caddyfile, tinybird エンドポイント等で使用）
ghost_domain: "hanatane.net"

# ---- Ghost 6 フル機能トグル ----
# 各機能を有効にすると、対応するサービスが docker-compose.yml に追加される。
# 無効にするには false にして ansible-playbook を再実行する（ロールバック可能）。

# Web Analytics（Tinybird Cloud）
# 有効化前に runbook の「Tinybird ブートストラップ手順」を実施し、
# secrets/ghost.env に TINYBIRD_* トークンを追加しておくこと。
ghost_analytics_enabled: true

# ActivityPub（Social Web 自己ホスト）
# 有効化前に docs/runbook.md の「ActivityPub 有効化手順」を確認すること。
# 制限: フォロワー最大2000、フォロー最大2000、1日100インタラクション
ghost_activitypub_enabled: true

# ---- イメージタグ ----
# ghost_image_tag は Renovate が自動追跡する。
# 以下は手動管理（Renovate のカスタムマネージャー追加で自動化可能）。

caddy_image_tag: "2.10.2-alpine"
traffic_analytics_image_tag: "1.0.255"
activitypub_image_tag: "1.2.6"
